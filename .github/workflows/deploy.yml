# Tên của quy trình tự động hiển thị trên tab Actions của GitHub
name: MailMerge CI/CD

# SỰ KIỆN KÍCH HOẠT (Trigger):
# 1. Tự động kiểm thử & đồng bộ code khi push lên nhánh 'main'
# 2. Hoặc đóng gói phát hành khi bạn push Git Tag (ví dụ: v1.0.5)
# 3. Tự động kiểm thử (CI Unit Test) khi mở Pull Request vào nhánh 'main'
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# DANH SÁCH CÔNG VIỆC MÀ ROBOT SẼ LÀM (Jobs):
jobs:
  build-and-deploy:
    # Yêu cầu GitHub cấp một máy chủ ảo chạy hệ điều hành Ubuntu Linux mới nhất
    runs-on: ubuntu-latest

    # Các bước tuần tự từ 1 đến 6 mà máy chủ ảo sẽ thực hiện:
    steps:
      # BƯỚC 1: Kéo toàn bộ code bạn vừa push trên GitHub vào trong máy chủ ảo
      - name: 1. Tải mã nguồn (Checkout code)
        uses: actions/checkout@v4

      # BƯỚC 2: Cài đặt phần mềm Node.js phiên bản 20 vào máy chủ ảo
      # (Giống hệt bước bạn vừa chạy fix-npm.bat trên máy cá nhân)
      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # BƯỚC 3: Đọc tệp package.json và tải clasp + jest về thư mục node_modules của máy ảo
      - name: 3. Cài đặt thư viện
        run: npm install

      # BƯỚC 4 (Giai đoạn CI - Kiểm thử): Chạy lệnh 'npm test'
      # Nếu có bất kỳ bài test nào báo đỏ (FAIL), Robot sẽ DỪNG NGAY LẬP TỨC tại bước này
      # và KHÔNG đẩy code lỗi lên Google Apps Script để bảo vệ người dùng!
      - name: 4. Chạy kiểm thử mã nguồn (Unit Test)
        run: npm test

      # BƯỚC 5: Lấy chìa khóa đăng nhập Google (được cất an toàn trong két sắt GitHub Secrets)
      # và tạo ra tệp .clasprc.json trên máy chủ ảo để công cụ clasp có quyền truy cập
      - name: 5. Xác thực tài khoản Google Clasp
        if: github.event_name == 'push'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node -e 'fs.writeFileSync(require("os").homedir() + "/.clasprc.json", process.env.CLASPRC_JSON)'

      # BƯỚC 6: Khởi tạo tệp .clasp.json từ tệp mẫu .clasp.json.example và Secret SCRIPT_ID
      - name: 6. Khởi tạo cấu hình .clasp.json từ Template
        if: github.event_name == 'push'
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const scriptId = process.env.SCRIPT_ID;
            if (!scriptId) {
              console.error("LỖI: Chưa cấu hình Secret SCRIPT_ID trên GitHub Repository Settings!");
              process.exit(1);
            }
            let tpl = fs.readFileSync(".clasp.json.example", "utf8");
            tpl = tpl.replace("<SCRIPT_ID>", scriptId.trim());
            fs.writeFileSync(".clasp.json", tpl);
            console.log("Đã khởi tạo .clasp.json thành công từ SCRIPT_ID!");
          '

      # BƯỚC 7 (Giai đoạn CD - Đồng bộ): Đẩy toàn bộ code trong thư mục src/
      # lên bản thảo phát triển (HEAD) của Google Apps Script
      - name: 7. Đẩy mã nguồn lên Google Apps Script (HEAD)
        if: github.event_name == 'push'
        run: npx clasp push --force

      # BƯỚC 8 (Giai đoạn CD - Phát hành chính thức): CHỈ chạy khi bạn gõ lệnh tạo Git Tag (ví dụ: v1.1.2)
      # Robot sẽ tự động đóng gói Version và CẬP NHẬT ĐÈ TRỰC TIẾP vào 2 Deployment đang Active:
      # 1. Manage Cache Storage (Add-on phục vụ Google Sheets)
      # 2. Open Tracking Service (Web App nhận tín hiệu mở email)
      - name: 8. Tự động cập nhật các Deployment Active (Add-on & Tracking Web App)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npx clasp deploy -i AKfycbyKfCVe_XvnrWl8i2Rw4TFAs-40XlJfGA3vtYKKYvJcHOPlVmRjsOfshrKpaIIwmYGH --description "Release ${{ github.ref_name }} (Add-on)"
          npx clasp deploy -i AKfycbziVBkjablulWN_BQoh8TA8DeROesuBQtEKU_fMdvj0TMxYPuhZysXPO84etxNP-CI0 --description "Release ${{ github.ref_name }} (Open Tracking Web App)"